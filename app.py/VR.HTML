<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script>
      // Fetch vitals from Flask backend
      async function updateVitals() {
        const response = await fetch("/vitals");
        const data = await response.json();
        document.getElementById("vitals").innerText =
          `HR: ${data.heart_rate} | BP: ${data.blood_pressure} | O2: ${data.oxygen_level}%`;
      }
      setInterval(updateVitals, 2000);
    </script>
  </head>
  <body>
    <div id="vitals" style="color:white; position:absolute; top:10px; left:10px;"></div>
    <a-scene>
      <!-- Example organ model -->
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>
      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
    </a-scene>
  </body>
</html>
